<a routerLink="/projects" class="mb-3 inline-block text-xs font-medium text-brand-green">Back to projects</a>

@if (loading()) {
  <app-spinner />
} @else {
  @if (project(); as project) {
    <app-page-header [title]="project.name" [subtitle]="project.description || 'Task sheet'">
      <select
        [value]="project.status"
        (change)="updateProjectStatus($any($event.target).value)"
        class="rounded-lg border border-line bg-surface px-3 py-2 text-sm text-ink">
        @for (status of projectStatuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </app-page-header>

    <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
      <input
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
        placeholder="Filter tasks"
        class="w-64 rounded-lg border border-line bg-surface px-3 py-2 text-sm text-ink" />
      <p class="text-xs text-ink-muted">{{ project.visibility || "DEPARTMENT" }} · {{ visibleTasks().length }} tasks</p>
    </div>

    @if (error()) {
      <p class="mb-3 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700">{{ error() }}</p>
    }

    <div class="overflow-x-auto rounded-xl border border-line bg-surface-elevated">
      <table class="w-full min-w-215 border-collapse text-sm">
        <thead class="bg-surface-muted text-left text-xs uppercase tracking-wide text-ink-muted">
          <tr>
            <th class="border-b border-line px-3 py-2 font-medium">Task</th>
            <th class="border-b border-line px-3 py-2 font-medium">Status</th>
            <th class="border-b border-line px-3 py-2 font-medium">Priority</th>
            <th class="border-b border-line px-3 py-2 font-medium">Assignee</th>
            <th class="border-b border-line px-3 py-2 font-medium">Due</th>
            <th class="border-b border-line px-3 py-2 font-medium"></th>
          </tr>
        </thead>
        <tbody>
          @for (task of visibleTasks(); track task.id) {
            <tr class="hover:bg-surface-muted/60">
              <td class="border-b border-line px-3 py-2 font-medium text-ink">{{ task.title }}</td>
              <td class="border-b border-line px-3 py-1.5">
                <select [value]="task.status" (change)="setStatus(task, $any($event.target).value)" class="w-full rounded border border-transparent bg-transparent px-1 py-1 text-xs text-ink hover:border-line">
                  @for (status of statuses; track status) {
                    <option [value]="status">{{ status }}</option>
                  }
                </select>
              </td>
              <td class="border-b border-line px-3 py-1.5">
                <select [value]="task.priority" (change)="setPriority(task, $any($event.target).value)" class="w-full rounded border border-transparent bg-transparent px-1 py-1 text-xs text-ink hover:border-line">
                  @for (priority of priorities; track priority) {
                    <option [value]="priority">{{ priority }}</option>
                  }
                </select>
              </td>
              <td class="border-b border-line px-3 py-1.5">
                <select [value]="assigneeId(task)" (change)="setAssignee(task, $any($event.target).value)" class="w-full rounded border border-transparent bg-transparent px-1 py-1 text-xs text-ink hover:border-line">
                  <option value="">Unassigned</option>
                  @for (person of staff(); track person.id) {
                    <option [value]="person.id">{{ displayName(person) }}</option>
                  }
                </select>
              </td>
              <td class="border-b border-line px-3 py-1.5">
                <input type="date" [value]="dueValue(task)" (change)="setDue(task, $any($event.target).value)" class="rounded border border-transparent bg-transparent px-1 py-1 text-xs text-ink hover:border-line" />
              </td>
              <td class="border-b border-line px-3 py-2 text-right">
                <button type="button" class="text-xs text-red-500" (click)="deleteTask(task)">Remove</button>
              </td>
            </tr>
          }
          <tr>
            <td class="px-3 py-2" colspan="6">
              <input
                [ngModel]="draftTitle()"
                (ngModelChange)="draftTitle.set($event)"
                (keydown.enter)="addTask()"
                placeholder="Add a task and press Enter"
                class="w-full bg-transparent text-sm text-ink outline-none" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  }
}
