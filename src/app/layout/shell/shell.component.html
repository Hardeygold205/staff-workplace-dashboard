<div class="flex h-screen overflow-hidden bg-surface-elevated">
  <div class="hidden lg:block">
    <app-sidebar />
  </div>

  @if (sidebar.mobileOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-black/50" (click)="sidebar.closeMobile()"></div>
      <div class="absolute inset-y-0 left-0 w-64">
        <app-sidebar />
      </div>
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar />
    <main class="flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>

@if (!auth.isPlatformAdmin()) {
  <app-attendance-reminder-modal />
}

<app-modal
  [open]="forceLogoutModal().open"
  [title]="forceLogoutModal().title"
  [dismissible]="false"
>
  <div class="space-y-4">
    <p class="text-sm text-ink-muted">
      {{ forceLogoutModal().message }}
    </p>

    <div class="flex justify-end pt-2">
      <button
        type="button"
        class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-black dark:text-white shadow hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/50"
        (click)="onConfirmForceLogout()"
      >
        Acknowledge & Re-login
      </button>
    </div>
  </div>
</app-modal>
